# Sanadex.wanis.online — nginx reverse proxy
#
# 1. replace the domain, 2. put this file in /etc/nginx/sites-available/sanadex
# 3. ln -s /etc/nginx/sites-available/sanadex /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. certbot --nginx -d sanadex.wanis.online   (adds HTTPS + redirect)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sanadex.wanis.online;

    # Allow invoice logos and product images, keep everything else small.
    client_max_body_size 32m;

    # Security headers (HTTPS is added by certbot below).
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/sanadex.access.log;
    error_log  /var/log/nginx/sanadex.error.log;

    # Long-cache the design assets; they are versioned with ?v=3.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        # Google Drive OAuth callbacks can be slow on first connect.
        proxy_send_timeout 120s;
    }

    # Health probe used by monitoring / docker.
    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        access_log off;
    }
}
