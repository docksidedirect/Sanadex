{% extends 'base.html' %}
{% block actions %}
<a class="btn" href="{{ url_for('attendance') }}">{{ icon('arrow-left')|safe }} {{ t('back') }}</a>
{% endblock %}
{% block content %}
<form method="post" class="card">
  <div class="card-head"><span class="card-title">{{ t('attendance') }}</span></div>
  <div class="card-body">
    <div class="form-grid" style="margin-bottom:14px">
      <div class="span-3 field"><label class="label" for="adate">{{ t('date') }}</label>
        <input class="input" id="adate" type="date" name="adate" value="{{ now }}"></div>
      <div class="span-3 field"><label class="label" for="status">{{ t('status') }}</label>
        <select class="select" id="status" name="status">
          <option value="present">{{ t('att_present') }}</option>
          <option value="absent">{{ t('att_absent') }}</option>
          <option value="late">{{ t('att_late') }}</option>
        </select></div>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th style="width:50px"><input type="checkbox" checked
          onclick="document.querySelectorAll('.emp').forEach(c=>c.checked=this.checked)"></th>
          <th>{{ t('employee') }}</th></tr></thead>
        <tbody>
          {% for employee in employees %}
          <tr><td><input class="emp" type="checkbox" name="emp_{{ employee.id }}" value="1" checked></td>
            <td>{{ employee.name }}</td></tr>
          {% else %}<tr><td colspan="2" class="muted tiny">{{ t('no_data') }}</td></tr>{% endfor %}
        </tbody>
      </table>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-primary" type="submit">{{ icon('save')|safe }} {{ t('save') }}</button>
    </div>
  </div>
</form>
{% endblock %}
